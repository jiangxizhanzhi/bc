# 系统配置项

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=${GMT}
spring.main.allow-bean-definition-overriding=true

# 禁止springboot自动刷库
spring.flyway.enabled=false

# 错误码公共前缀，根据项目不同分别设置
errorPrefix=OJ-

spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB

# 使用本地缓存
spring.cache.type=caffeine
spring.cache.caffeine.spec=initialCapacity=50,maximumSize=1000,expireAfterWrite=60s

# rabbitmq配置，消息设置为自动ack
spring.rabbitmq.host=${MQ.HOST:10.100.0.101}
spring.rabbitmq.port=${MQ.PORT:5673}
spring.rabbitmq.username=${MQ.USERNAME:guest}
spring.rabbitmq.password=${MQ.PASSWORD:guest}
spring.rabbitmq.connectionTimeout=5000

# 资源导入数据覆盖 true=资源导入时，数据已存在则删除重新导入
import.resource.cover=false
