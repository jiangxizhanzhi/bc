# \u7CFB\u7EDF\u914D\u7F6E\u9879

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=${TZ:Asia/Shanghai}
spring.main.allow-bean-definition-overriding=true

# flyway
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:static/sql/bc,classpath:${INIT_SQL_PATH:static/sql/data_zh-cn}
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.encoding=UTF-8
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true

# \u9519\u8BEF\u7801\u516C\u5171\u524D\u7F00\uFF0C\u6839\u636E\u9879\u76EE\u4E0D\u540C\u5206\u522B\u8BBE\u7F6E
errorPrefix=OJ-

spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB

# \u4F7F\u7528\u672C\u5730\u7F13\u5B58
spring.cache.type=caffeine
spring.cache.caffeine.spec=initialCapacity=50,maximumSize=1000,expireAfterWrite=300s

# rabbitmq\u914D\u7F6E\uFF0C\u6D88\u606F\u8BBE\u7F6E\u4E3A\u81EA\u52A8ack
spring.rabbitmq.host=${MQ_HOST:10.100.0.101}
spring.rabbitmq.port=${MQ_PORT:5673}
spring.rabbitmq.username=${MQ_USERNAME:guest}
spring.rabbitmq.password=${MQ_PASSWORD:guest}
spring.rabbitmq.connectionTimeout=5000

# \u63A5\u53E3\u8BBF\u95EE\u9891\u7387\u53C2\u6570\u8BBE\u7F6E
permitsPerSeconds=1000
warmupPeriod=1

# \u6001\u52BF\u6570\u636E\u5237\u65B0\u9891\u7387\u53C2\u6570(\u79D2/\u6B21)
situation.refresh.rate=5

# \u573A\u666F\u6279\u542F\u52A8\u6570\u91CF
scene.batch.number=5

# mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# \u6BCF\u4E2A\u7248\u672C\u4F11\u8981\u4FEE\u590D\u7248\u672C\u53F7\uFF0C\u4FEE\u590D\u7248\u4E5F\u9700\u8981\u4FEE\u6539\u7248\u672C\u53F7\u5982\uFF1A5.4.1.1\u4FEE\u590D\u7248\u548Ctag\u5BF9\u9F50
ojj.version=5.4.1
