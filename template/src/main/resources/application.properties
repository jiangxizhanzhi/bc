# 系统配置项

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

spring.main.allow-bean-definition-overriding=true

# 禁止springboot自动刷库
spring.flyway.enabled=false

# 错误码公共前缀，根据项目不同分别设置
errorPrefix=OJ-

spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB

# 使用本地缓存
spring.cache.type=caffeine
spring.cache.caffeine.spec=initialCapacity=50,maximumSize=1000,expireAfterWrite=60s

# rabbitmq配置，消息设置为自动ack
spring.rabbitmq.host=${MQ.HOST}
spring.rabbitmq.port=${MQ.PORT}
spring.rabbitmq.username=${MQ.USERNAME}
spring.rabbitmq.password=${MQ.PASSWORD}
