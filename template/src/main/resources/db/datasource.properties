# 常量定义
datasource.postfix=autoReconnect=true&useUnicode=true&characterEncoding=utf8
# 声明数据库连接
# rtks业务
spring.datasource.rtks.jdbc-url=jdbc:mysql://${RTKS_DB_HOST:10.100.2.20}:${RTKS_DB_PORT:3305}/${RTKS_DB_NAME:ojj}?${datasource.postfix}
spring.datasource.rtks.username=${RTKS_DB_USER:root}
spring.datasource.rtks.password=${RTKS_DB_PASSWORD:CqeImmpa1PPMoeaF}
spring.datasource.rtks.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.rtks.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.rtks.hikari.minimum-idle=15
spring.datasource.rtks.hikari.maximum-pool-size=200
spring.datasource.rtks.hikari.auto-commit=true
spring.datasource.rtks.hikari.idle-timeout=30000
spring.datasource.rtks.hikari.pool-name=DatebookHikariCP
spring.datasource.rtks.hikari.max-lifetime=1800000
spring.datasource.rtks.hikari.connection-timeout=15000
spring.datasource.rtks.hikari.connection-test-query=SELECT 1
