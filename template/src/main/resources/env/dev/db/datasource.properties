#\u6570\u636E\u5E93\u914D\u7F6E
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=dm.jdbc.driver.DmDriver
spring.datasource.jdbc-url=jdbc:dm://${BC_DB_HOST:127.0.0.1}:${BC_DB_PORT:9306}?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=utf-8
spring.datasource.username=${BC_DB_USER:BC}
spring.datasource.password=${BC_DB_PASSWORD:cyberpeace@2020}
spring.datasource.druid.initialSize=5
spring.datasource.druid.minIdle=5
spring.datasource.druid.maxActive=20
spring.datasource.druid.maxWait=60000
spring.datasource.druid.timeBetweenEvictionRunsMillis=60000
spring.datasource.druid.minEvictableIdleTimeMillis=300000
spring.datasource.druid.validationQuery=SELECT1FROMDUAL
spring.datasource.druid.testWhileIdle=true
spring.datasource.druid.testOnBorrow=false
spring.datasource.druid.testOnReturn=false
spring.datasource.druid.filters=stat,wall,log4j
spring.datasource.druid.logSlowSql=true

#jpa\u914D\u7F6E
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.DmDialect

