log4j.rootLogger=INFO, root

log4j.appender.root=org.apache.log4j.DailyRollingFileAppender
log4j.appender.root.File=${catalina.base}/logs/rtks.log
log4j.appender.root.layout=org.apache.log4j.PatternLayout
log4j.appender.root.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-4r [%t] %-5p %c %x - %m%n
log4j.appender.root.MaxBackupIndex=10
log4j.appender.root.Append=true
log4j.appender.root.Threshold=INFO