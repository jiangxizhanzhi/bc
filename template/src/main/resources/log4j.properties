log4j.rootLogger=info, rootAppender, stdout
log4j.logger.resourceImport=info, resourceImportAppender, stdout
log4j.logger.mq=info, mqAppender, stdout
log4j.logger.mp=info, mpAppender, stdout
log4j.additivity.resourceImport = false
log4j.additivity.mq = false
log4j.additivity.mp = false

log4j.appender.rootAppender=org.apache.log4j.DailyRollingFileAppender
log4j.appender.rootAppender.File=${catalina.base}/logs/bc.log
log4j.appender.rootAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.rootAppender.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-4r [%t] %-5p %c %x - %m%n
log4j.appender.rootAppender.Append=true
log4j.appender.rootAppender.Threshold=info

log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.Encoding=UTF-8
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-4r [%t] %-5p %c %x - %m%n

log4j.appender.resourceImportAppender=org.apache.log4j.DailyRollingFileAppender
log4j.appender.resourceImportAppender.File=${catalina.base}/logs/resourceImport.log
log4j.appender.resourceImportAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.resourceImportAppender.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-4r [%t] %-5p %c %x - %m%n
log4j.appender.resourceImportAppender.Append=true
log4j.appender.resourceImportAppender.Threshold=info

log4j.appender.mpAppender=org.apache.log4j.DailyRollingFileAppender
log4j.appender.mpAppender.File=${catalina.base}/logs/mp.log
log4j.appender.mpAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.mpAppender.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-4r [%t] %-5p %c %x - %m%n
log4j.appender.mpAppender.Append=true
log4j.appender.mpAppender.Threshold=info

log4j.appender.mqAppender=org.apache.log4j.DailyRollingFileAppender
log4j.appender.mqAppender.File=${catalina.base}/logs/mq.log
log4j.appender.mqAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.mqAppender.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-4r [%t] %-5p %c %x - %m%n
log4j.appender.mqAppender.Append=true
log4j.appender.mqAppender.Threshold=info

log4j.level.com.cyberpeace.oj.rtks.dao.mapper=debug
log4j.level.com.cyberpeace.cr.tool.dao.mapper=debug
log4j.level.com.cyberpeace.oj.rtks.service.impl=debug