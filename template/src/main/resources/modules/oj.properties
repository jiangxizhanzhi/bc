# oj所有的配置项

# 实训场景动态flag生成模板
oj.flag.template.data=%s{flag{%s}}

# 实训后台课时场景监控刷新时间
oj.monitor.refresh.interval=5

# 设置为-1, 场景不自动进行销毁
oj.destroy.delay.close=-1

# 习题内容最大长度
oj.practice.content.max.length=500

# 课程表时间设置范围
oj.classroom.start.time=8
oj.classroom.end.time=21

