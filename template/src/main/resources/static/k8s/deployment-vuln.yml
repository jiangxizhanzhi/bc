apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vuln
  template:
    metadata:
      labels:
        app: vuln
    spec:
      containers:
        # ------------------- Tomcat bc  容器 -------------------
        - name: vuln-java
          image: docker.io/library/app:5.4c
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: TZ
              value: "Asia/Shanghai"
            - name: BC_DB_HOST
              value: "10.4.1.37"
            - name: BC_DB_PORT
              value: "9306"
            - name: BC_DB_NAME
              value: "bc"
            - name: BC_DB_USER
              value: "root"
            - name: BC_DB_PASSWORD
              value: "cyberpeace@NzM1M"
            - name: MP_HOST
              value: "mp-service"
            - name: MP_PORT
              value: "8001"
            - name: OJJ_SERVER
              value: "http://bc-service:8996"
            - name: MP_SECRET
              value: "84261d495c414e,2112f4b855264ad7b1a4209737fc7836"
            - name: PROJECT_NAME   # MQ 组件被删除，不用引用
              value: "VULN"
          volumeMounts:
            - name: volume-apps
              mountPath: /usr/local/tomcat/webapps
              subPath: vuln/webapps
            - name: volume-log
              mountPath: /usr/local/tomcat/logs
              subPath: vuln
            - name: volume-resource
              mountPath: /data/resource
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: timezone
              mountPath: /etc/timezone
              readOnly: true
            - name: volume-apps
              mountPath: /home/start.sh
              subPath: vuln/start.sh
              readOnly: true
      # ------------------- 所有共享卷定义 -------------------
      volumes:
        - name: volume-apps
          persistentVolumeClaim:
            claimName: pvc-apps
        - name: volume-log
          persistentVolumeClaim:
            claimName: pvc-log
        - name: volume-resource
          persistentVolumeClaim:
            claimName: pvc-resource
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: timezone
          hostPath:
            path: /etc/timezone

