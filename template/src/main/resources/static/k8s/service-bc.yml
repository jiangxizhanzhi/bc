apiVersion: v1
kind: Service
metadata:
  name: bc-service
spec:
  selector:
    app: bc  # 选择与 bc-deployment 配对的 Pod
  ports:
    - name: bc-http
      protocol: TCP
      port: 8996  # 对外暴露的端口
      targetPort: 8080  # 容器内的端口
      nodePort: 30996
    - name: bc-test   # 调试端口
      protocol: TCP
      port: 5005
      targetPort: 5005
      nodePort: 30055
  type: NodePort   # 内部访问，如果需要外部访问，使用 LoadBalancer 或 NodePort
