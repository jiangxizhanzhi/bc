apiVersion: v1
kind: Service
metadata:
  name: drm-service
spec:
  selector:
    app: drm  # 选择与 bc-deployment 配对的 Pod
  ports:
    - name: drm-http
      protocol: TCP
      port: 8007  # 对外暴露的端口
      targetPort: 8080  # 容器内的端口
      nodePort: 30807
  type: NodePort   # 内部访问，如果需要外部访问，使用 LoadBalancer 或 NodePort
