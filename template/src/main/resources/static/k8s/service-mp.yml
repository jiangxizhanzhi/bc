apiVersion: v1
kind: Service
metadata:
  name: mp-service
spec:
  selector:
    app: mp  # 选择与 mp-deployment 配对的 Pod
  ports:
    - name: mp-http
      protocol: TCP
      port: 8001  # 对外暴露的端口
      targetPort: 8080 # 容器内的端口
      nodePort: 30008
  type: NodePort   # 内部访问，如果需要外部访问，使用 LoadBalancer 或 NodePort
