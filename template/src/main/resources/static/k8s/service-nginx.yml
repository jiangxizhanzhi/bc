apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app: nginx  # 选择与 bc-deployment 配对的 Pod
  ports:
    - name: nginx-http  # 知识空间
      protocol: TCP
      port: 80      # 对外暴露的端口
      targetPort: 80  # 容器内的端口
      nodePort: 30000
    - name: nginx-iframe-xdkj  #  行动框架，指挥员和操作员页面
      protocol: TCP
      port: 83
      targetPort: 83
      nodePort: 30002
  # 华为云支持LoadBalancer类型， 需要配置公网IP地址
  type: NodePort   # 内部访问，如果需要外部访问，使用 LoadBalancer 或 NodePort
