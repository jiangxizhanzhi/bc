apiVersion: v1
kind: Service
metadata:
  name: vuln-service
spec:
  selector:
    app: vuln  # 选择与 bc-deployment 配对的 Pod
  ports:
    - name: vuln-http
      protocol: TCP
      port: 8988  # 对外暴露的端口
      targetPort: 8080  # 容器内的端口
      nodePort: 30988
  type: NodePort   # 内部访问，如果需要外部访问，使用 LoadBalancer 或 NodePort
