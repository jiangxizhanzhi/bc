<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Document</title>
    <style>
        <#include "./css/common.css">
        <#include "./css/index.css">
    </style>
    <script>
        <!-- #include 不可获取模板文件位置向上路径的文件, 复制"js/"到同级目录 -->
        <#include "./js/echarts.min.js">
        <#include "./js/draw_pie.js">
    </script>
</head>

<body>
<div class="page flex-col">
    <div class="bd1 flex-col">
        <div class="outer-block outer1 flex-col justify-center width600">
            <span class="word1">${title}</span>
        </div>
        <div class="outer-block outer2 flex-col"></div>
        <div class="outer-block outer3 flex-row">
            <!--
            <div class="box1 flex-col">
                <img class="icon1" referrerpolicy="no-referrer" src="${user_logo}"/>
            </div>
            -->
            <span class="info1">${username}</span>
            <span class="info2">${locale.train_score}：</span>
            <span class="txt1">${score}</span>
            <span class="txt2">${locale.total_score}：${total_score}</span>
        </div>
        <div class="outer-block outer4 flex-row justify-between">
            <div class="main1 flex-col"></div>
            <span class="word2">${locale.train_score}</span>
        </div>
        <div class="outer-block outer5 flex-col align-center" id='score'></div>
        <script>
            drawPersonalTaskStatusRing('score', ["${locale.completed}", "${locale.ongoing}"], [<#list task_count as icount>${icount},</#list>], "${locale.pcs_task}");
        </script>
        <div class="outer-block outer7 flex-row justify-between">
            <div class="section1 flex-col"></div>
            <span class="info4">${locale.skill_score}</span>
        </div>
        <div class="outer-block outer8 flex-col">
            <div id="skillScore"></div>
            <script>
                drawRadar("skillScore", [<#list radar as r>${r},</#list>], [<#list radarLabels as radarLabel>"${radarLabel.label}",</#list>])
            </script>
        </div>
        <div class="outer-block outer9 flex-row justify-between">
            <div class="outer-block outer10 flex-col"></div>
            <span class="word11">${locale.train_record}</span>
        </div>
        <div class="outer29 flex-col">
            <#include "./stages.html">
        </div>
    </div>
</div>
</body>

</html>
