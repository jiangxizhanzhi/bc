<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Document</title>
<!--    <link rel="stylesheet" type="text/css" href="css/index.css">-->
    <style>
        <#include "./css/index.css">
    </style>
</head>

<body>
<div class="page">
  <!-- 实验报告 -->
  <div class="report">
    <div class="title">${report_content_title}</div>
    <div class="report-info">
      <div>${report_content}</div>
    </div>
  </div>
  <!-- 评分 -->
  <div class="score-area">
    <div class="left-title">${score_title}</div>
    <div class="score">${score}</div>
  </div>
  <!-- 是否通过 -->
  <div class="pass-area">
    <div class="left-title">${passed_title}</div>
    <div class="pass-result">${passed}</div>
  </div>
  <!-- 评语 -->
  <div class="comment-area">
    <div class="left-title">${evaluate_comment_title}</div>
    <div class="comment-info">${evaluate_comment}</div>
  </div>
</div>
</body>

</html>
