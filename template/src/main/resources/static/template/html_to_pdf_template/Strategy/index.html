<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>策略报告</title>

    <style>
      <#include "./index.css">
    </style>
    <script>
    </script>
  </head>
  <body>
  <#list data as strategy>
  <div class="wrapper">
    <div class="info">
      <div class="info-txt"><span>策略名称：</span>${strategy.name}</div>
      <div class="info-txt"><span>策略归属：</span>${strategy.route}</div>
    </div>
    <div class="box">
      <div class="header">基本信息</div>
      <div class="content">
          策略依据
          ${strategy.gauge}
          策略内容
          ${strategy.content}
      </div>
    </div>
    <div class="box">
      <div class="header">配置样例</div>
      <div class="content">
        <pre>
         ${strategy.example}
        </pre>
      </div>
    </div>
  </div>
  </#list>
  </body>
</html>
